name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both officially supported firmware targets must compile from a clean
  # dependency cache (every library is pinned to an exact version in
  # firmware/platformio.ini). A compile error in any supported
  # optional-feature combination fails the build.
  #
  # The compiled images are also uploaded as run artifacts, so any commit — a
  # branch, a PR, or main — can be downloaded and flashed without a local
  # toolchain. GitHub keeps run artifacts for 90 days; tagged releases carry the
  # same files permanently (see firmware-release.yml).
  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, xiao_esp32c6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        # esptool is pinned to the 4.x line: package_build.sh calls the v4
        # `esptool.py merge_bin` spelling, which 5.x renamed.
        run: pip install platformio "esptool~=4.8"
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
        working-directory: firmware
      - name: Package flashable images
        run: ./firmware/ci/package_build.sh ${{ matrix.env }}
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/dist/
          if-no-files-found: error

  # Optional features are off by default, so the builds above never compile
  # them. Build the C6 once per supported combination so a change there cannot
  # ship uncompiled: the GATT clients (HiveTraffic counter, HiveHeart / wireless
  # HiveScale), and the wired DS18B20 probes with each alternative ambient
  # sensor (exactly one may be enabled). Their libraries are the commented-out
  # lib_deps lines in platformio.ini, at the same pins. The images are not
  # packaged: these variants only have to compile.
  firmware-build-variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gatt-clients
            flags: -DENABLE_WIRELESS_BEECOUNTER=1 -DENABLE_BEEHIVE_GATT=1
            libs: ""
          # libs: one library spec per line (names contain spaces).
          - name: ds18b20-bme280
            flags: -DENABLE_DS18B20_HIVE_TEMP=1 -DENABLE_SHT4X_AMBIENT=0 -DENABLE_BME280_AMBIENT=1
            libs: |
              https://github.com/PaulStoffregen/OneWire.git#800f26f3ee6eb446a72e013785cac3700e54cc13
              milesburton/DallasTemperature@3.11.0
              adafruit/Adafruit BME280 Library@2.2.4
          - name: sht3x
            flags: -DENABLE_SHT4X_AMBIENT=0 -DENABLE_SHT3X_AMBIENT=1
            libs: |
              adafruit/Adafruit SHT31 Library@2.2.2
          # The HiveInside relays share GATT-client scaffolding (the scan's
          # address-type cache). Both are on by default, so only these builds
          # prove each one compiles without the other — an audio-only build
          # once lost the cache with the OTA flag and failed to compile.
          - name: hiveinside-audio-only
            flags: -DHIVEINSIDE_OTA_ENABLED=0 -DHIVEINSIDE_AUDIO_ENABLED=1
            libs: ""
          - name: hiveinside-ota-only
            flags: -DHIVEINSIDE_OTA_ENABLED=1 -DHIVEINSIDE_AUDIO_ENABLED=0
            libs: ""
          - name: hiveinside-no-relays
            flags: -DHIVEINSIDE_OTA_ENABLED=0 -DHIVEINSIDE_AUDIO_ENABLED=0
            libs: ""
    name: firmware-build-variant (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio "esptool~=4.8"
      - name: Add the variant's libraries
        if: matrix.libs != ''
        working-directory: firmware
        # Through the environment, one spec per line: library names contain
        # spaces, and quoting them inside the script text does not survive the
        # expression being pasted into it. --skip-dependencies: each variant
        # lists every library it needs, and DallasTemperature's declared
        # dependency would otherwise replace the pinned C6-capable OneWire
        # commit with the 2.3.8 release, which does not compile on the C6.
        env:
          LIBS: ${{ matrix.libs }}
        run: |
          while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            pio pkg install -e xiao_esp32c6 --no-save --skip-dependencies --library "$lib"
          done <<< "$LIBS"
      - name: Build xiao_esp32c6 (${{ matrix.name }})
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.flags }}
        run: pio run -e xiao_esp32c6
        working-directory: firmware

  # Host-level tests for the checked I2C layer: the exact production headers
  # (nau7802_checked.h, scale_math.h, scale_topology.h) run against a scripted
  # mock TwoWire so failed mux writes/readbacks, stale channel selections,
  # failed NAU channel switches, short reads, partial sample sets, timeouts,
  # railed values, excessive variance and invalid topologies are all injected
  # deterministically.
  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: ./firmware/host_test/run_tests.sh
      # The pure BLE-decoder headers also have host unit tests (real captured
      # payloads). They were previously not run in CI, which let a decode
      # regression ship unnoticed — keep them wired in here.
      - name: Build and run BLE decoder tests
        run: |
          set -e
          g++ -std=gnu++17 -Wall -Wextra -Werror -I firmware/include \
              -o /tmp/test_ruuvi_decode test-data/test_ruuvi_decode.cpp
          /tmp/test_ruuvi_decode
          g++ -std=gnu++17 -Wall -Wextra -Werror -I firmware/include \
              -o /tmp/test_beehive_decode test-data/test_beehive_decode.cpp
          /tmp/test_beehive_decode
      # The HiveTraffic measurement decoder is a two-repo wire contract: it has
      # to keep reading fw:2 documents from counters the OTA relay has not
      # reached yet, as well as the fw:3, fw:4 and fw:5 ones newer firmware
      # emits. A captured document of each revision is asserted here.
      - name: Build and run bee counter wire tests
        run: |
          set -e
          g++ -std=gnu++17 -Wall -Wextra -Werror -I firmware/include \
              -o /tmp/test_bee_counter_wire test-data/test_bee_counter_wire.cpp
          /tmp/test_bee_counter_wire
      # Night mode decides whether to blind a bee counter, and gets it wrong
      # quietly in both directions — a lost day of foraging looks like bad
      # weather, and a counter that never sleeps looks like nothing at all.
      # Midnight wrap, an unsynced clock and the traffic gate are all pinned
      # here rather than left to a season of field observation.
      - name: Build and run night mode tests
        run: |
          set -e
          g++ -std=gnu++17 -Wall -Wextra -Werror -I firmware/include \
              -o /tmp/test_night_mode test-data/test_night_mode.cpp
          /tmp/test_night_mode
      # HiveInside 0.8.0 reports the gain it applied in DATA header byte 3;
      # older nodes always send 0 there. Reporting that byte from an old node
      # would label a +20 dB recording "0 dB", silently, so the parse and the
      # version gate are pinned here.
      - name: Build and run HiveInside audio header tests
        run: |
          set -e
          g++ -std=gnu++17 -Wall -Wextra -Werror -I firmware/include \
              -o /tmp/test_hiveinside_audio_header test-data/test_hiveinside_audio_header.cpp
          /tmp/test_hiveinside_audio_header

  server-tests:
    runs-on: ubuntu-latest
    # The pairing-lifecycle suite needs a real database: the claim/release bug it
    # guards lived in SQL, so there is nothing to unit-test around it. Every other
    # suite here is pure logic and ignores this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hivehub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential python3-dev
          # httpx2: Starlette's TestClient transport (test_backend_db.py).
          pip install -r server/requirements.txt pytest httpx2==2.13.1
      - name: Run server test suite
        env:
          DATABASE_URL: postgresql://ci-not-used/ci
          PYTHONPATH: server
        run: |
          python3 test-data/test_counter_rules.py
          python3 test-data/test_accel_rules.py
          python3 test-data/test_ble_sensor_rules.py
          # Multi-hive insights: every detector ran for hives 3-18 and had every
          # alert silently discarded by a Literal[1, 2] channel annotation, and
          # the acoustic detectors read the legacy stereo mic keys that no
          # HiveInside deployment ever populates. Both failed without an error
          # anywhere, so they are pinned here.
          python3 test-data/test_multihive_insights.py
          # Inspections/calibration cut the series, acoustic evidence is fresh,
          # counter rates use real elapsed time, windows must be covered.
          python3 test-data/test_insight_data_quality.py
          python3 test-data/test_inspection_masking.py
          python3 test-data/test_measurement_id.py
          python3 test-data/test_claim_code_reporting.py
          python3 test-data/test_version_order.py
          python3 test-data/test_counter_differencing.py
          python3 test-data/test_sd_import.py
          python3 test-data/test_data_export.py
          python3 test-data/test_bee_counter_banks.py
          python3 test-data/test_recordings.py
          python3 -m pytest -q test-data/test_tempcomp.py test-data/test_hive_tempcomp.py \
                            test-data/test_hiveheart_fft.py \
                            test-data/test_mqtt_ha_discovery.py \
                            test-data/test_relay_ota_gate.py test-data/test_publish.py \
                            test-data/test_channel_links.py \
                            test-data/test_oidc_sso.py
      # The mock server ships verbatim copies of the production insights engine
      # and its FFT helper: its Dockerfile build context is test-data/mock-server,
      # so it cannot reach ../../server and the files have to be duplicated. Left
      # unguarded they drifted several releases behind — the copy was missing the
      # HiveHeart FFT detector, the "acoustic" category and the low-rate BLE
      # thresholds, and it carried the Literal[1, 2] channel bug long after the
      # server was fixed. A mock that quietly disagrees with production is worse
      # than no mock, so pin them byte-for-byte.
      - name: Mock server copies match production
        run: |
          diff -u server/insights.py test-data/mock-server/insights.py
          diff -u server/hiveheart_fft.py test-data/mock-server/hiveheart_fft.py
      # --require-db turns an unreachable database into a failure rather than a
      # skip, so a broken service container can never leave this job green while
      # silently testing nothing.
      - name: Run database-backed tests against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hivehub_test
          PYTHONPATH: server
        run: |
          python3 test-data/test_pairing_lifecycle.py --require-db
          # Session revocation, pool-connection nesting (run on a one-connection
          # pool) and auth-before-parse on the upload routes.
          python3 test-data/test_backend_db.py --require-db
          # Recording lifecycle: the streaming timeout counts from the upload's
          # start, and a late report overrules a sweep that guessed wrong.
          python3 test-data/test_recordings_db.py --require-db

  # Keep the website/configurator and dashboard scripts at least syntactically
  # sound so a broken script cannot ship unnoticed, and run the portal tests.
  website-js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check website and dashboard scripts
        run: |
          set -e
          for f in website/assets/*.js website/dashboard-demo/assets/*.js server/dashboard/assets/*.js; do
            node --check "$f"
          done
      # The provisioning portal's pairing page, extracted from portal.cpp and
      # run in jsdom. Without jsdom the suite only prints SKIP.
      - name: Portal pairing tests
        run: |
          npm install --no-save --silent jsdom@30.1.2
          node test-data/test_portal_pairing.js
